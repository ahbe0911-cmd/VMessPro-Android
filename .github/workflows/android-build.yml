name: Android Build

on:
  push:
    branches: [ main, develop, 'fix/**', 'refactor/**', 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      LIBXRAY_COMMIT: e8cc06d7427251fa549093e7cc32c28b0f5fbafa
      ANDROID_NDK_VERSION: 28.0.13004108

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36 and NDK r28
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Restore libXray cache
        id: libxray-cache
        uses: actions/cache/restore@v4
        with:
          path: app/libs/libxray.aar
          key: libxray-16k-${{ runner.os }}-${{ env.LIBXRAY_COMMIT }}-ndk-${{ env.ANDROID_NDK_VERSION }}-go-1.26

      - name: Build Amnezia libXray AAR
        if: steps.libxray-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf amnezia-libxray-src
          git clone https://github.com/amnezia-vpn/amnezia-libxray.git amnezia-libxray-src
          cd amnezia-libxray-src
          git checkout --detach "${LIBXRAY_COMMIT}"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"

          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.sh")
          text = p.read_text()
          old = '-checklinkname=0" -trimpath'
          new = '-checklinkname=0 -extldflags=-Wl,-z,max-page-size=16384" -trimpath'
          if old not in text:
              raise SystemExit("Expected gomobile ldflags line not found in pinned libXray build.sh")
          p.write_text(text.replace(old, new, 1))
          PY
          grep -n "max-page-size=16384" build.sh

          chmod +x build.sh
          ./build.sh android
          test -s libxray.aar
          cd ..
          mkdir -p app/libs
          cp amnezia-libxray-src/libxray.aar app/libs/libxray.aar
          test -s app/libs/libxray.aar

      - name: Save libXray cache
        if: steps.libxray-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/libs/libxray.aar
          key: libxray-16k-${{ runner.os }}-${{ env.LIBXRAY_COMMIT }}-ndk-${{ env.ANDROID_NDK_VERSION }}-go-1.26

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Lint
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain :app:lintDebug --stacktrace
          lint_status=$?
          if [ "${lint_status}" -ne 0 ] && [ -f app/build/reports/lint-results-debug.txt ]; then
            cat app/build/reports/lint-results-debug.txt
          fi
          exit "${lint_status}"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VMessPro-lint-report
          path: |
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Build compact APKs
        run: gradle --no-daemon :app:assembleCompact

      - name: Show APK sizes
        shell: bash
        run: |
          find app/build/outputs/apk/compact -type f -name '*.apk' -print0 | xargs -0 -r du -h

      - name: Upload compact APKs
        uses: actions/upload-artifact@v4
        with:
          name: VMessPro-Android-A54-0.6.0
          path: app/build/outputs/apk/compact/*.apk
          if-no-files-found: error
          retention-days: 14
