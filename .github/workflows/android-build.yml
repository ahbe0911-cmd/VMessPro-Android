name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SING_BOX_VERSION: v1.13.19
      ANDROID_NDK_VERSION: 28.0.13004108

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36 and NDK r28
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Go 1.24.7
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: false

      - name: Restore libbox cache
        id: libbox-cache
        uses: actions/cache/restore@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ runner.os }}-${{ env.SING_BOX_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}-go-1.24.7

      - name: Build sing-box libbox AAR
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sing-box-src
          git clone --depth 1 --branch "${SING_BOX_VERSION}" https://github.com/SagerNet/sing-box.git sing-box-src
          cd sing-box-src
          make lib_install
          export PATH="$(go env GOPATH)/bin:${PATH}"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          make lib_android
          cd ..
          mkdir -p app/libs
          cp sing-box-src/libbox.aar app/libs/libbox.aar
          test -s app/libs/libbox.aar

      - name: Save libbox cache
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ runner.os }}-${{ env.SING_BOX_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}-go-1.24.7

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Lint
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain :app:lintDebug --stacktrace
          lint_status=$?
          if [ "${lint_status}" -ne 0 ] && [ -f app/build/reports/lint-results-debug.txt ]; then
            cat app/build/reports/lint-results-debug.txt
          fi
          exit "${lint_status}"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VMessPro-lint-report
          path: |
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.vmesspro.android
            adb shell am start -W -n com.vmesspro.android/.MainActivity
            sleep 6
            pid="$(adb shell pidof -s com.vmesspro.android | tr -d '\r')"
            if [ -z "${pid}" ]; then
              echo "VMess Pro UI process died during startup"
              adb logcat -d
              exit 1
            fi
            echo "VMess Pro startup smoke test passed with PID ${pid}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VMessPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
